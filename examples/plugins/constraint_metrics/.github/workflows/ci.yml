name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality and viewer dependencies
        run: python -m pip install black build isort pytest pytest-asyncio ruff twine '.[viewer]'
      - name: Lint
        run: ruff check .
      - name: Check import order
        run: isort --check-only .
      - name: Check formatting
        run: black --check .
      - name: Test standalone viewer
        run: python -m pytest -q tests/test_viewer_*.py
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
